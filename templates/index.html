<!DOCTYPE html>
<html>
<head>
    <title>DMX Show Player</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>DMX Show Player</h1>

        <div id="status" class="status">
            Loading...
        </div>

        <div id="recordings"></div>

        <button class="stop" onclick="stopPlayback()">STOP</button>
        <button class="blackout" onclick="blackout()">BLACKOUT</button>
    </div>

    <script>
        async function loadRecordings() {
            const response = await fetch("/api/recordings");
            const recordings = await response.json();

            const container = document.getElementById("recordings");
            container.innerHTML = "";

            recordings.forEach(recording => {
                const div = document.createElement("div");
                div.className = "recording";

                div.innerHTML = `
                    <h2>${recording.name.replace(".jsonl", "")}</h2>
                    <p>Music: ${recording.music || "None"}</p>
                    <button onclick="playRecording('${recording.name}')">
                        PLAY
                    </button>
                `;

                container.appendChild(div);
            });
        }

        async function playRecording(name) {
            await fetch(
                "/api/play/" + encodeURIComponent(name)
            );
            updateStatus();
        }

        async function stopPlayback() {
            await fetch("/api/stop");
            updateStatus();
        }

        async function blackout() {
            await fetch("/api/blackout");
            updateStatus();
        }

        async function updateStatus() {
            const response = await fetch("/api/status");
            const status = await response.json();

            const element = document.getElementById("status");

            if (status.playing) {
                element.innerHTML =
                    "Playing: " +
                    status.show +
                    "<br>Frame: " +
                    status.frame;
            } else {
                element.innerHTML = "Idle";
            }
        }

        loadRecordings();
        updateStatus();

        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
